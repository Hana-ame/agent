<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exec Logs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #f0f6fc; padding: 20px; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; margin-bottom: 8px; color: #58a6ff; }
  .flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, textarea, select { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 8px 10px; color: #f0f6fc; font-size: 0.9rem; }
  input:focus { outline: none; border-color: #58a6ff; }
  button { background: #238636; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #2ea043; }
  button.ghost { background: transparent; border: 1px solid #30363d; color: #8b949e; }
  button.ghost:hover { background: #21262d; color: #f0f6fc; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { border: 1px solid #30363d; padding: 6px 10px; text-align: left; }
  th { background: #21262d; color: #8b949e; font-weight: 500; }
  td { color: #f0f6fc; }
  .ok { color: #3fb950; font-weight: 600; }
  .err { color: #f85149; font-weight: 600; }
  .toggle { background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; color: #8b949e; display: inline-flex; align-items: center; gap: 6px; user-select: none; margin-bottom:8px; }
  .toggle:hover { background: #30363d; }
  .toggle .arrow { transition: transform .2s; display: inline-block; }
  .toggle.open .arrow { transform: rotate(90deg); }
  .api-body { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom:12px; }
  .api-body.show { display: flex; }
  .api-body input { flex: 1; min-width: 200px; }
  .pagination { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-box h3 { margin-bottom: 12px; color: #f0f6fc; }
  .modal-box pre { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; color: #f0f6fc; max-height: 300px; overflow-y: auto; }
  .modal-close { float: right; cursor: pointer; color: #8b949e; font-size: 1.3rem; }
  .modal-close:hover { color: #f0f6fc; }
</style>
</head>
<body>

<h1>📋 Exec Logs</h1>

<div>
  <div class="toggle" onclick="this.classList.toggle('open');document.getElementById('apiBody').classList.toggle('show')">
    <span class="arrow">▶</span> API Endpoint
  </div>
  <div class="api-body" id="apiBody">
    <input id="apiBase" value="https://wsl-8000.moonchan.xyz" placeholder="API 地址">
    <button onclick="applyApi()">应用</button>
  </div>
</div>

<div class="card">
  <h2>执行日志</h2>
  <div class="flex" style="margin-bottom:8px">
    <input id="filterNode" placeholder="按节点名筛选" style="flex:0 0 180px">
    <button onclick="loadExecs()">刷新</button>
    <span style="font-size:0.8rem;color:#8b949e" id="countInfo"></span>
  </div>
  <table>
    <thead><tr><th style="width:50px">ID</th><th>节点</th><th>模型</th><th>输入</th><th>输出ID</th><th style="width:60px">状态</th><th>耗时</th><th>Tokens</th><th style="width:140px">时间</th><th style="width:50px"></th></tr></thead>
    <tbody id="execTable"></tbody>
  </table>
  <div class="pagination" id="pagination"></div>
</div>

<div class="modal" id="detailModal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle">执行详情</h3>
    <div style="margin-bottom:8px;font-size:0.85rem;color:#8b949e">
      <span>Node: <b id="detailNode" style="color:#58a6ff"></b></span>
      <span style="margin-left:16px">状态: <b id="detailStatus"></b></span>
      <span style="margin-left:16px">耗时: <b id="detailElapsed" style="color:#f0f6fc"></b>s</span>
    </div>
    <div style="margin-bottom:8px;font-size:0.85rem;color:#8b949e">
      <span>Input IDs: <b id="detailInputIds" style="color:#f0f6fc"></b></span>
      <span style="margin-left:16px">Output ID: <b id="detailOutputId" style="color:#3fb950"></b></span>
    </div>
    <div style="margin-bottom:8px;font-size:0.85rem;color:#8b949e">
      <span>Input: <b id="detailInTok" style="color:#f0f6fc"></b></span>
      <span style="margin-left:16px">Output: <b id="detailOutTok" style="color:#f0f6fc"></b></span>
      <span style="margin-left:16px">Total: <b id="detailTotTok" style="color:#f0f6fc"></b></span>
    </div>
    <pre id="detailError" style="display:none;border-color:#f85149;color:#f85149"></pre>
  </div>
</div>

<script>
var BASE = localStorage.getItem('api_base') || 'https://wsl-8000.moonchan.xyz';
var cursorPrev = null;
var cursorNext = null;

function applyApi() {
  BASE = document.getElementById('apiBase').value.trim();
  localStorage.setItem('api_base', BASE);
}

function api(path) {
  var url = (BASE + '/api' + path).replace(/([^:]\/)\/+/g, '$1/');
  return fetch(url).then(function(r) {
    if (!r.ok) throw Error(r.statusText);
    return r.json();
  });
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadExecs(dir) {
  var node = document.getElementById('filterNode').value.trim();
  var url = '/execs?limit=20';
  if (node) url += '&node_name=' + encodeURIComponent(node);
  if (dir === 'older') url += '&id_lt=' + cursorPrev;
  if (dir === 'newer') url += '&id_gt=' + cursorNext;

  api(url).then(function(res) {
    var tbody = document.getElementById('execTable');
    tbody.innerHTML = '';
    res.items.forEach(function(r) {
      var statusClass = r.status === 'success' ? 'ok' : 'err';
      var statusText = r.status === 'success' ? '✓' : '✗';
      var inputIds = r.input_ids ? r.input_ids.split(',').slice(0,3).join(',') + (r.input_ids.split(',').length > 3 ? '…' : '') : '-';
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + r.id + '</td>' +
        '<td style="font-weight:600">' + esc(r.node_name) + '</td>' +
        '<td style="font-size:0.75rem;max-width:100px;overflow:hidden;text-overflow:ellipsis">' + esc(r.model || '-') + '</td>' +
        '<td style="font-size:0.75rem;max-width:100px;overflow:hidden;text-overflow:ellipsis">' + esc(inputIds) + '</td>' +
        '<td>' + (r.output_id || '-') + '</td>' +
        '<td class="' + statusClass + '">' + statusText + '</td>' +
        '<td>' + (r.elapsed != null ? r.elapsed.toFixed(1) + 's' : '-') + '</td>' +
        '<td style="font-size:0.75rem">' + r.input_tokens + '/' + r.output_tokens + '/' + r.total_tokens + '</td>' +
        '<td style="font-size:0.75rem;color:#8b949e">' + (r.created_at || '') + '</td>' +
        '<td><button class="ghost" onclick="showDetail(' + r.id + ')">详情</button></td>';
      tbody.appendChild(tr);
    });
    if (res.items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#8b949e;padding:20px">暂无执行记录</td></tr>';
    }

    if (res.items.length > 0) {
      cursorNext = res.items[0].id;
      cursorPrev = res.items[res.items.length - 1].id;
    }

    var pages = document.getElementById('pagination');
    pages.innerHTML = '';
    if (res.has_more) {
      pages.innerHTML += '<button class="ghost" onclick="loadExecs(\'older\')">← 更旧</button>';
    }
    document.getElementById('countInfo').textContent = '显示 ' + res.items.length + ' 条';
  }).catch(function(e) {
    document.getElementById('execTable').innerHTML = '<tr><td colspan="10" style="color:#f85149;text-align:center">加载失败: ' + e.message + '</td></tr>';
  });
}

function showDetail(id) {
  api('/execs?id_gt=' + (id - 1) + '&id_lt=' + (id + 1)).then(function(res) {
    var item = res.items.find(function(i) { return i.id === id; });
    if (!item) return;
    document.getElementById('detailNode').textContent = item.node_name;
    document.getElementById('detailStatus').textContent = item.status;
    document.getElementById('detailStatus').className = item.status === 'success' ? 'ok' : 'err';
    document.getElementById('detailElapsed').textContent = item.elapsed;
    document.getElementById('detailInputIds').textContent = item.input_ids || '-';
    document.getElementById('detailOutputId').textContent = item.output_id || '-';
    document.getElementById('detailInTok').textContent = item.input_tokens;
    document.getElementById('detailOutTok').textContent = item.output_tokens;
    document.getElementById('detailTotTok').textContent = item.total_tokens;
    var errEl = document.getElementById('detailError');
    if (item.error) {
      errEl.style.display = 'block';
      errEl.textContent = item.error;
    } else {
      errEl.style.display = 'none';
    }
    document.getElementById('detailModal').classList.add('show');
  });
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('show');
}

window.onload = function() {
  loadExecs();
  setInterval(loadExecs, 5000);
};
</script>

</body>
</html>
