[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-toolbox"
version = "0.5.0"
description = "Modular FPGA verification toolbox with anti-silent-pass guardrails for AI agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
fpga-toolbox = "fpga_toolbox.cli:main"

[tool.setuptools]
packages = ["fpga_toolbox", "fpga_toolbox.core"]

[tool.ruff]
target-version = "py310"
line-length = 130
extend-exclude = ["examples"]

[tool.ruff.lint]
# Deliberately narrow: syntax errors, pyflakes, import order. Style churn is not a CI concern.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
