<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #f0f6fc; padding: 20px; min-height: 100vh; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; max-width: 500px; margin: 40px auto; }
  h1 { font-size: 1.3rem; margin-bottom: 16px; text-align: center; }
  .flex { display: flex; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 8px 10px; color: #f0f6fc; font-size: 0.9rem; }
  input:focus { outline: none; border-color: #58a6ff; }
  button { background: #238636; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #2ea043; }
  .result { margin-top: 12px; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; display: none; }
  .result.success { display: block; background: #0d2818; border: 1px solid #238636; color: #3fb950; }
  .result.error { display: block; background: #290e0e; border: 1px solid #da3633; color: #f85149; }
  .status { text-align: center; margin-top: 8px; font-size: 0.8rem; color: #8b949e; }
</style>
</head>
<body>

<div class="card">
  <h1>🔌 Ping Test</h1>
  <div class="flex">
    <input id="apiUrl" value="https://wsl-8000.moonchan.xyz" placeholder="API 地址">
  </div>
  <div style="text-align:center">
    <button onclick="ping()">Ping</button>
  </div>
  <div class="result" id="result"></div>
  <div class="status" id="status">点击 Ping 测试连接</div>
</div>

<script>
function ping() {
  var url = document.getElementById('apiUrl').value.trim().replace(/\/+$/, '') + '/ping';
  var result = document.getElementById('result');
  var status = document.getElementById('status');

  result.className = 'result';
  status.textContent = '⏳ 请求中...';

  fetch(url, { method: 'GET', mode: 'cors' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text) {
      result.className = 'result success';
      result.textContent = '响应: ' + text;
      status.textContent = '✅ 连接成功';
    })
    .catch(function(e) {
      result.className = 'result error';
      result.textContent = '错误: ' + e.message;
      status.textContent = '❌ 连接失败';
    });
}
</script>

</body>
</html>
