[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dag_agent"
version = "7.0.0"
description = "A modular, tag-driven, clean-context DAG agent framework with Meta-DAG self-modification and multi-version evolution."
readme = "README.md"
authors = [{ name = "Hana-ame & DeepMind Team" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
