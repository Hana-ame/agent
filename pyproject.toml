[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-edge-agent"
version = "6.0.0"
description = "VEA V6 — pure tag-driven information-flow DAG framework with preset-edge synthesis and meta-DAG builder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vertex Edge Agent Team" }
]
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["vea_v6*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
