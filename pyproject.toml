[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dag"
version = "7.0.0"
description = "Tag-driven DAG execution framework (`import dag`)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.2",
]

[tool.setuptools.packages.find]
include = ["dag*"]
