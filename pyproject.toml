[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-edge-agent"
version = "3.0.0"
description = "A data-driven, highly-scalable DAG execution engine for AI Agent pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vertex Edge Agent Team" }
]
dependencies = [
    "httpx>=0.24",
    "tenacity>=8.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
