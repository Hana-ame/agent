name: gitproxy-ci

on:
  push:
    paths:
      - 'gitproxy/**'
      - '.github/workflows/gitproxy-ci.yml'
  pull_request:
    paths:
      - 'gitproxy/**'
      - '.github/workflows/gitproxy-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitproxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: go vet
        run: go vet .
      - name: go test
        run: go test -v .
      - name: build (linux/amd64)
        run: go build -o gitproxy .
      - name: cross build (windows/amd64, darwin/arm64)
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null .
