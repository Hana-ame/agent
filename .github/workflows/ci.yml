name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 离线门禁：不碰外网、不碰真实 LLM。这个 job 必须恒绿，它才是合并闸门。
  offline:
    name: offline (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # 先验框架完整性，再跑测试：早先的顺序是 pytest 在前，pytest 一红就把
    # fixpoint / gen3 / oneshot 全部 skip，于是固定点漂移在 CI 里长期看不见
    # （2026-10-19 起 4 次 push 全红，原因正是 fixpoint 清单没重新固化）。
    - name: Verify framework fixed point
      # 逐字节自校验：清单 sha/bytes 与真实源码全符 + 生成器能复现自己
      run: python tools/fixpoint_v3.py --check

    - name: DAG registry smoke
      # 新链路：注册表能发现 dag_defs，且每个 DAG 满足契约（可达性/元数据/产物路径）
      run: |
        python -m dags list
        python -m pytest tests/test_dag_contracts.py -q --timeout=120

    - name: Run offline test suite
      # conftest 默认跳过 @pytest.mark.network / llm；--timeout 防止任何环节挂死
      run: python -m pytest tests/ -q --timeout=300

    - name: Verify four-generation self-bootstrap
      # 内存内连续自举四代，逐字节比对（不调模型）
      run: python tools/gen3_probe.py

    - name: Verify one-shot chain (offline)
      # 磁盘框架连续三代自举，每代落盘并自校验
      run: python tools/oneshot_chain.py --generations 3 --offline

    - name: Run examples
      run: |
        python examples/05_vea_v6_quickstart.py
        python examples/06_vea_v6_meta_builder.py

  # 联网门禁：只有手动触发才跑（stage1st.com 抓取 + 真实 LLM 端点）。
  # 独立 job 的意义：网络抖动永远不会把离线闸门染红。
  network:
    name: network (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run network tests
      run: python -m pytest tests/ -q --run-network --timeout=600
