name: gitproxy-release

on:
  push:
    tags:
      - 'gitproxy-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'release tag, e.g. gitproxy-v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitproxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: test before release
        run: |
          go vet .
          go test .

      - name: build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/gitproxy-${os}-${arch}"
            if [ "$os" = "windows" ]; then out="$out.exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$out" .
          done
          ls -la dist

      - name: create release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "gitproxy ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*

      - name: create release (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "gitproxy ${{ inputs.version }}" \
            --generate-notes \
            dist/*
